<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrumEstimate — Estimation Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- ── Top bar — brand, plus room controls once you're in a room ─ -->
  <header class="topbar">
    <a class="brand" href="../index.html">ScrumEstimate</a>

    <!-- Room controls, grouped as one segmented cluster: the code and the two
         actions that operate on it are all room management, so they read as a
         single control instead of four things competing for the left side. -->
    <div id="topbar-room" class="topbar-room hidden">
      <div class="room-cluster">
        <span class="room-cluster-code">Room&nbsp;<strong id="room-code-display">—</strong></span>
        <button id="btn-share" class="room-cluster-btn" type="button" title="Copy the invite link">
          <!-- Lucide "copy", inlined: no CDN, works offline, nothing to SRI-pin. -->
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          <span id="btn-share-label">Share</span>
        </button>
        <button id="btn-leave" class="room-cluster-btn danger" type="button" title="Leave this room">
          <!-- Lucide "log-out" -->
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
          <span>Leave</span>
        </button>
      </div>
      <span id="share-status" class="visually-hidden" role="status" aria-live="polite"></span>
    </div>
  </header>

  <!-- ── Connecting ─────────────────────────────────────────────
       There is no form on this page: you arrive here already in a room, from
       create.html, join.html, or a refresh. This is what's on screen for the one
       round-trip that takes. -->
  <main id="room-loading" class="room-loading">
    <p>Connecting to the room…</p>
  </main>

  <!-- ── Room Panel ────────────────────────────────────────── -->
  <div id="room-panel" class="hidden">

    <div class="room-layout">

      <!-- Sidebar: participants -->
      <aside class="room-sidebar">

        <section class="panel">
          <h3 class="panel-title">Participants</h3>
          <ul id="participant-list" class="participant-list"></ul>
        </section>

      </aside>

      <!-- Main: cards + controls + results -->
      <div class="room-main">

        <section class="panel">
          <h3 class="panel-title">Cast Your Vote</h3>
          <div id="card-deck" class="card-deck"></div>
        </section>

        <div id="facilitator-controls" class="facilitator-controls hidden">
          <button id="btn-reveal" class="btn btn-primary" disabled>Reveal Votes</button>
          <button id="btn-reset" class="btn btn-secondary" disabled>New Round</button>
        </div>

        <section id="results-panel" class="panel hidden">
          <h3 class="panel-title">Results</h3>
          <div id="results-summary" class="results-summary"></div>
          <ul id="results-votes" class="results-votes"></ul>
        </section>

      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat). Pinned by version and by subresource integrity, so a
       swapped file on the CDN fails to execute rather than running as our code. -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
          integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1"
          crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"
          integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj"
          crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"
          integrity="sha384-g5H2aNdtgRBYOBLsuOAuHvUXWnw4bswmU+tYjmGc1G3JfKxl79uWwV4sQarJsLwu"
          crossorigin="anonymous"></script>
  <script src="../js/firebase-core.js"></script>
  <script src="../js/room.js"></script>
</body>
</html>
